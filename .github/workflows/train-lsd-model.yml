name: Entrenar y publicar modelo LSD

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: read

concurrency:
  group: lsd-model-production
  cancel-in-progress: false

jobs:
  train-evaluate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Instalar herramientas de entrenamiento
        run: pip install -r training/requirements.txt

      - name: Exportar muestras LSD aprobadas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python training/export_dataset.py

      - name: Entrenar, evaluar y convertir a TensorFlow.js
        run: python training/train.py

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Compilar SignTalk con el modelo aprobado
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_ENABLE_GEMINI_ANALYSIS: 'false'
        run: |
          npm ci
          npm run build

      - name: Publicar modelo y aplicación en Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

