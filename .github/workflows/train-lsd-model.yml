name: Entrenar y publicar modelo LSD

on:
  workflow_dispatch:
    inputs:
      triggerSource:
        description: Origen de la solicitud de entrenamiento
        required: false
        default: manual
        type: string
  schedule:
    - cron: '0 8 * * 1'
  push:
    branches: [main]
    paths:
      - 'training/**'
      - '.github/workflows/train-lsd-model.yml'

permissions:
  contents: write

concurrency:
  group: lsd-model-production
  cancel-in-progress: false

jobs:
  train-evaluate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Instalar herramientas de entrenamiento
        run: |
          python -m pip install -r training/requirements.txt

      - name: Recuperar contexto corporal de videos existentes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python training/backfill_body_landmarks.py

      - name: Preparar conversión TensorFlow.js
        run: |
          # TF-DF 1.11 genera sus mensajes con Protobuf 6.31.1, mientras
          # TensorFlow 2.18 declara un limite antiguo. El runtime nuevo es
          # retrocompatible y evita que tensorflowjs falle al importarse.
          python -m pip install --no-deps protobuf==6.31.1
          python -c "import tensorflow, tensorflowjs; print('TensorFlow/TFJS listos')"

      - name: Exportar muestras LSD aprobadas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python training/export_dataset.py

      - name: Entrenar, evaluar y convertir a TensorFlow.js
        run: python training/train.py

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Compilar SignTalk con el modelo aprobado
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_ENABLE_GEMINI_ANALYSIS: 'false'
        run: |
          npm ci
          npm run build

      - name: Publicar modelo y aplicación en Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Conservar modelo aprobado en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/lsd/
          if ! git diff --cached --quiet; then
            git commit -m "Update trained LSD model [skip ci]"
            git push origin HEAD:main
          fi
